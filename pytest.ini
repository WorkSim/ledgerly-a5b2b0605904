[pytest]
; testpaths intentionally unset — test paths (tests/visible, tests/grading)
; are always passed explicitly on the command line, never run implicitly.
; pythonpath makes the `ledgerly` package importable regardless of the
; invocation cwd (paths are relative to this ini file's directory).
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
